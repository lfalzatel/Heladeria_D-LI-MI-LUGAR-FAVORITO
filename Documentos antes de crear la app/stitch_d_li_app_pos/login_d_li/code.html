<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>D'LI App - Iniciar Sesión</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Playball&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#012200",
                        "surface-container-high": "#eae7e7",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#3e0021",
                        "secondary": "#874e58",
                        "on-surface-variant": "#594048",
                        "surface-bright": "#fcf9f8",
                        "background": "#fcf9f8",
                        "inverse-primary": "#ffb0cc",
                        "outline": "#8d6f79",
                        "surface-variant": "#e4e2e1",
                        "on-primary-fixed-variant": "#8d0051",
                        "on-surface": "#1b1c1c",
                        "surface-container-highest": "#e4e2e1",
                        "on-background": "#1b1c1c",
                        "on-error": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "on-tertiary-fixed-variant": "#035300",
                        "tertiary": "#046c00",
                        "surface-dim": "#dcd9d9",
                        "inverse-surface": "#303030",
                        "secondary-fixed-dim": "#fcb3be",
                        "primary": "#b30069",
                        "surface": "#fcf9f8",
                        "inverse-on-surface": "#f3f0f0",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#69df54",
                        "secondary-fixed": "#ffd9de",
                        "primary-container": "#df0e84",
                        "secondary-container": "#ffb6c1",
                        "tertiary-fixed": "#85fd6d",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#ffb0cc",
                        "error": "#ba1a1a",
                        "surface-tint": "#b8006c",
                        "on-secondary-container": "#7b444e",
                        "on-secondary-fixed-variant": "#6b3741",
                        "on-primary": "#ffffff",
                        "surface-container": "#f0eded",
                        "surface-container-low": "#f6f3f2",
                        "on-tertiary-container": "#f8ffef",
                        "on-secondary-fixed": "#360c17",
                        "tertiary-container": "#068800",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#e1bdc8",
                        "primary-fixed": "#ffd9e4"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": [
                            "Plus Jakarta Sans"
                        ],
                        "body": [
                            "Plus Jakarta Sans"
                        ],
                        "label": [
                            "Plus Jakarta Sans"
                        ],
                        "brand": [
                            "Playball"
                        ]
                    }
                },
            },
        }
    </script>
<style>
        .font-brand { font-family: 'Playball', cursive; }
        .glass-panel {
            background: rgba(252, 249, 248, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface min-h-screen relative overflow-hidden flex flex-col justify-center items-center">
<!-- Splash Background (Organic Waves) -->
<div class="absolute inset-0 z-0 pointer-events-none w-full h-full object-cover" data-alt="Abstract soft pink and fuchsia organic fluid waves, melting creamy texture, elegant luxurious background, high-end editorial feel, diffused lighting" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCi15xiR5qfgC_Ud2Cq4aRTR9rj4o6nGFKC4D4Gh75vUnUl5lX7YFwRUNKslojl8ybVRS7m3aIPPwDp2GOlA2L7hppDJRvfu-ZaFXm6qKnEsNCEvIfMc9B4OlqzLfOPeFwCcm3iigGtAKYfhc1TWp2T-u-M9KqD4LyQxEmJZdYKNOUSTzZwLcuPTIMHWHH4OK8LONACENQEvcFaMQidCwiK0DAcYc7fM6rWOE22zQw924WLt4T8KOOEjdAKMC2fblpZz2CvifN8f4U'); background-size: cover; background-position: center;">
<div class="absolute inset-0 bg-gradient-to-b from-surface/40 via-surface/80 to-surface"></div>
</div>
<!-- Decorative Top Blobs to break edges -->
<div class="absolute -top-20 -left-20 w-96 h-96 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/4 -right-32 w-[30rem] h-[30rem] bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md px-6 flex flex-col items-center">
<!-- Brand Header -->
<div class="text-center mb-12 flex flex-col items-center gap-2">
<h1 class="font-brand text-6xl text-primary tracking-tight">D'LI</h1>
<p class="font-body text-on-surface-variant text-sm font-medium uppercase tracking-widest opacity-80">Boutique</p>
</div>
<!-- Login Card -->
<div class="w-full glass-panel rounded-xl p-8 shadow-[0_20px_60px_rgba(179,0,105,0.06)] relative overflow-hidden">
<!-- Subtle internal highlight -->
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>
<div class="text-center mb-8">
<h2 class="font-headline text-2xl font-bold text-on-surface">Bienvenido de nuevo</h2>
<p class="text-on-surface-variant text-sm mt-2">Ingresa tus datos para continuar</p>
</div>
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-semibold text-secondary" for="email">Correo Electrónico</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-high border-none rounded-full py-4 pl-12 pr-6 text-on-surface placeholder:text-outline/70 focus:ring-0 focus:bg-surface-container-highest transition-all duration-300" id="email" placeholder="tucorreo@ejemplo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2 mt-2">
<div class="flex justify-between items-center">
<label class="font-label text-sm font-semibold text-secondary" for="password">Contraseña</label>
<a class="text-xs font-semibold text-primary hover:text-primary-container transition-colors" href="#">Olvidé mi contraseña</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-high border-none rounded-full py-4 pl-12 pr-12 text-on-surface placeholder:text-outline/70 focus:ring-0 focus:bg-surface-container-highest transition-all duration-300" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-6 w-full rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold py-4 px-8 shadow-[0_10px_30px_rgba(179,0,105,0.2)] hover:shadow-[0_15px_40px_rgba(179,0,105,0.3)] transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                    Iniciar Sesión
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<p class="text-sm text-on-surface-variant">¿No tienes cuenta? <a class="font-bold text-primary hover:text-primary-container transition-colors" href="#">Regístrate</a></p>
</div>
</div>
</main>
<!-- Simulated Progress Bar (Bottom) -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-surface-container-high/50">
<!-- Width would normally be animated via JS, set to 30% for visual -->
<div class="h-full bg-gradient-to-r from-primary via-primary-container to-primary w-[30%] rounded-r-full shadow-[0_0_10px_rgba(179,0,105,0.5)]"></div>
</div>
</body></html>
